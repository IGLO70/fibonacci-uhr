; Fibonacci-Spiralen-Uhr - WT32-SC01 (ESP32-WROVER-B, 3.5" 480x320, ST7796, 8-Bit parallel)
[env:wt32-sc01]
platform = espressif32@^6.9.0   ; Arduino-Core 2.x (TFT_eSPI Parallel-Modus laeuft NICHT mit Core 3.x)
board = esp32dev
framework = arduino
; Bibliotheks-Abhängigkeiten vollständig verfolgen
lib_ldf_mode = deep+

monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

; monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4

build_flags =
    ; Debug-Ausgaben
    -DCORE_DEBUG_LEVEL=3

    ; ---------------------------------------------------------
    ; WT32-SC01 mit ESP32-WROVER-B
    ; ST7796 Display ueber SPI
    ; ---------------------------------------------------------

    ; PSRAM des ESP32-WROVER aktivieren
    -DBOARD_HAS_PSRAM

    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1

    ; Displaygroesse im Hochformat
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

    ; SPI-Pins des WT32-SC01
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=21
    -DTFT_RST=22

    ; Hintergrundbeleuchtung
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH

    ; Schriftarten
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; SPI-Takt
    -DSPI_FREQUENCY=40000000