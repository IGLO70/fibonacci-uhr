; ============================================================
; Fibonacci-Spiralen-Uhr - gemeinsames Multi-Board-Projekt
;
; In PlatformIO nur das gewuenschte Environment auswaehlen:
;   wt32-sc01
;   sunton-8048s070
; ============================================================

[platformio]
default_envs = wt32-sc01

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
    adafruit/RTClib@^2.1.4

; ------------------------------------------------------------
; WT32-SC01 - ESP32-WROVER-B, 480x320, ST7796 SPI
; ------------------------------------------------------------
[env:wt32-sc01]
platform = espressif32@^6.9.0
board = esp32dev
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DBOARD_WT32_SC01
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=21
    -DTFT_RST=22
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

; ------------------------------------------------------------
; Sunton ESP32-8048S070 - ESP32-S3 N16R8, 800x480 RGB + GT911
; ------------------------------------------------------------
[env:sunton-8048s070]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.7

build_flags =
    -DBOARD_SUNTON_8048S070
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
